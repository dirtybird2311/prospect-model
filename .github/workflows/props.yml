name: Pull NFL player props

# FanDuel and Caesars player props from SportsGameOdds (free plan), plus a no-vig consensus. Snapshots go to
# data/props/. Needs a repository secret named SGO_API_KEY. Runs Thu, Sat and Sun mornings; also on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 15 * * 4'      # Thu 10:23 am ET
    - cron: '7 15 * * 6,0'     # Sat, Sun 10:07 am ET
  push:
    branches: [main]
    paths: [scripts/fetch_props.py]

permissions:
  contents: write

concurrency:
  group: props
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull props
        env:
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
        run: python3 scripts/fetch_props.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/props
          git diff --cached --quiet || git commit -m "NFL props snapshot"
          git pull --rebase -q
          git push
