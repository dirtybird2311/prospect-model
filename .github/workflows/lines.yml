name: Pull NFL lines

# Pinnacle spreads and totals for upcoming games, with nflverse as the fallback. Snapshots go to data/lines/.
# Runs Tue and Thu mornings, plus Sat and Sun before kickoff; also on demand from the Actions tab.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * 2,4'    # Tue, Thu 9:17 am ET
    - cron: '41 15 * * 6,0'    # Sat, Sun 10:41 am ET
  push:
    branches: [main]
    paths: [scripts/fetch_lines.py, .github/workflows/lines.yml]

permissions:
  contents: write

concurrency:
  group: lines
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull lines
        run: python3 scripts/fetch_lines.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lines
          git diff --cached --quiet || git commit -m "NFL lines snapshot"
          git pull --rebase -q
          git push
