name: Narrate a script

# Run by hand from the Actions tab. Turns a narration/scripts/*.json file into voice clips with the
# open-source Kokoro model and attaches them to the run as a downloadable artifact.
on:
  workflow_dispatch:
    inputs:
      script:
        description: Script file name in narration/scripts (without .json)
        default: sample_rb1

permissions:
  contents: read

jobs:
  narrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.2" soundfile
      - name: Narrate
        run: python3 narration/narrate.py "narration/scripts/${{ inputs.script }}.json" "narration/out/${{ inputs.script }}"
      - uses: actions/upload-artifact@v4
        with:
          name: narration-${{ inputs.script }}
          path: narration/out/${{ inputs.script }}
