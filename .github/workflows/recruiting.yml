name: Pull recruiting rankings

# Run by hand from the Actions tab. Needs a repository secret named CFBD_API_KEY.
on:
  workflow_dispatch:
    inputs:
      first_year:
        description: First recruiting class
        default: '2010'
      last_year:
        description: Last recruiting class
        default: '2026'

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull rankings
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python3 scripts/fetch_recruiting.py --first "${{ inputs.first_year }}" --last "${{ inputs.last_year }}"
      - name: Commit the CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recruiting
          git diff --cached --quiet || git commit -m "Update recruiting rankings (${{ inputs.first_year }}-${{ inputs.last_year }})"
          git push
